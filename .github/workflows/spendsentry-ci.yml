name: spendsentry-ci

on:
  pull_request:
    paths:
      - "projects/spendsentry/**"
      - ".github/workflows/spendsentry-ci.yml"
  push:
    branches:
      - main
    paths:
      - "projects/spendsentry/**"
      - ".github/workflows/spendsentry-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: spendsentry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/spendsentry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/spendsentry/package-lock.json

      # npm ci intentionally left out here: the point of this job is to prove
      # the exact path a stranger hits via `npm install github:...#path:...`,
      # which is a bare `npm install` (no lockfile-only ci) that triggers the
      # `prepare` lifecycle script to build dist/. Using npm ci would mask a
      # regression in that path (e.g. someone moving the build out of prepare).
      - name: Install (triggers prepare -> build)
        run: npm install

      - name: Assert dist/ was produced by prepare
        run: test -f dist/cli.js

      - name: Smoke test - help exits cleanly
        run: node dist/cli.js --help

      - name: Smoke test - check runs against an empty/no-op HOME
        env:
          HOME: /tmp/spendsentry-ci-empty-home
        run: |
          mkdir -p "$HOME"
          node dist/cli.js check --threshold 5 --window 24h --json
